name: MiniSync
version: 2.0.0
main: me.yourname.minisync.MiniSync
api-version: '1.20'
description: Discord-Minecraft account linking for NIGHTMARE TCYT
authors: [AnNgTv]
commands:
  sync:
    description: Liên kết tài khoản Discord với Minecraft
    usage: /sync <code>
    permission: minisync.use
  unsync:
    description: Hủy liên kết Discord với Minecraft
    usage: /unsync
    permission: minisync.use
permissions:
  minisync.use:
    description: Cho phép liên kết hoặc hủy liên kết tài khoản
    default: true
